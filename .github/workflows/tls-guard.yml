# حارسُ شهادة TLS — إنذارٌ قبل السقوط لا بعده.
# شهاداتُ Let's Encrypt تُجدَّد تلقائيّاً من Railway، ولذلك بالضبط لا ينظر إليها أحد.
# فإن فشل التجديدُ مرّةً لا يعلم أحدٌ **حتى تنتهي**، وحينها يسقط الموقعُ على كلّ
# الوكلاء دفعةً واحدةً بشاشةِ «الاتصالُ غيرُ آمن» — لا صفحةَ خطأٍ تُشخَّص.
#
# مرّتان أسبوعيّاً: السبت والأربعاء ٠٥:٠٠ بغداد (٠٢:٠٠ UTC). فالنافذةُ بين الفحصَين
# ثلاثةُ أيّامٍ ونصف، وحدُّ الإنذار ٢١ يوماً ⇒ سبعُ فرصٍ للتنبيه قبل أيّ خطرٍ حقيقيّ.
# **سحابيٌّ بحتٌ**: لا يلمس حاسبات المكاتب. وصفرُ كلفة.
# الأسرار المطلوبة (موجودة): CRON_SECRET + APP_BASE_URL.
name: tls-guard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 3,6"

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: فحصُ شهادة الموقع والإنذارُ قبل ٢١ يوماً
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: https://shakeebnet.com # كان سرّاً يشير إلى أزور القديمة — ثُبّت هنا بعد النقل إلى Railway (2026-08-20)
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/resp -w "%{http_code}" -m 60 "$APP_BASE_URL/api/cron/tls-guard" \
                 -H "Authorization: Bearer $CRON_SECRET" || echo 000)
          echo "الاستجابة: $code $(cat /tmp/resp)"
          # 200 يعني أنّ الفحصَ جرى — لا أنّ الشهادةَ سليمة. والحالةُ في جسم الردّ
          # (`ok`) وفي بريدِ المالك، فلا نُفشل المهمّةَ لأجل شهادةٍ قاربت الانتهاء
          # (الإفشالُ يُخفي السببَ خلف «job failed»). لكنّ تعذُّرَ الوصول خطأٌ حقيقيّ.
          [ "$code" = "200" ] || { echo "⛔ لم يُجَب الحارس (رمز $code)"; exit 1; }
