<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#081726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%D9%83%D8%A7%D8%A8%D9%8A%D9%86%D8%A9%22%2C%22short_name%22%3A%22%D9%83%D8%A7%D8%A8%D9%8A%D9%86%D8%A9%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230c1d31%22%2C%22theme_color%22%3A%22%230c1d31%22%2C%22dir%22%3A%22rtl%22%2C%22lang%22%3A%22ar%22%2C%22start_url%22%3A%22https%3A%2F%2Fshakeebnet.com%2Fapp%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fshakeebnet.com%2Ficons%2Ficon-192.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%2C%7B%22src%22%3A%22https%3A%2F%2Fshakeebnet.com%2Ficons%2Ficon-512.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
<title>كابينة — تطبيق المشترك</title>
<style>
/* ═══ معاينةُ /app: التطبيقُ كلُّه Flutter (مصدرٌ واحد) داخل إطارِ هاتف ═══
   معاينةٌ — بيانات وهمية (محاكاة) — معزولةٌ تماماً: لا قاعدةَ ولا جلساتٍ ولا نداءَ API،
   مجرّدُ غلافٍ رقيقٍ: iframe واحدٌ يحمّل بناءَ Flutter الثابت من /kabina-web (كلُّ الشاشات
   + الفحص + التنقّل السفليّ)، فأيُّ تعديلٍ في التطبيق يُصلَح مرّةً واحدةً في Flutter.
   وهو نفسُ الكود الذي سيُبنى تطبيقاً أصليّاً (Google Play / App Store) بلا نقل. */
* { box-sizing:border-box; margin:0; }
html, body { height:100%; }
body { background:#081726; font-family:'Segoe UI',Tahoma,sans-serif; overflow:hidden; }
.app-shell { min-height:100dvh; display:flex; justify-content:center; align-items:center; background:#081726; }
.phone-frame {
  position:relative;
  width:auto; aspect-ratio:1080/2340; height:min(100dvh,960px); max-width:100vw;
  background:#edf2f7; border:0; border-radius:0; overflow:hidden;
  display:flex; flex-direction:column;
}
.phone-frame iframe { flex:1; width:100%; height:100%; border:0; display:block; background:#edf2f7; }
/* شاشةُ تحميلٍ حتى يقلع محرّكُ Flutter (تختفي بمجرّد تحميل الإطار) */
.boot { position:absolute; inset:0; z-index:2; display:grid; place-items:center; background:#0b1f33; color:#6de0ec; font-size:12.5px; font-weight:700; transition:opacity .4s; }
.boot.gone { opacity:0; pointer-events:none; }
.boot .spin { width:34px; height:34px; margin-bottom:12px; border:3px solid #18b5d833; border-top-color:#18b5d8; border-radius:50%; animation:sp 1s linear infinite; }
@keyframes sp { to { transform:rotate(360deg); } }
@media (max-width:500px) {
  .app-shell { align-items:stretch; }
  .phone-frame { width:100%; height:100dvh; aspect-ratio:auto; }
}
</style>
</head>
<body>
<main class="app-shell" dir="rtl">
  <div class="phone-frame">
    <div class="boot" id="boot"><div style="display:flex;flex-direction:column;align-items:center"><div class="spin"></div>كابينة</div></div>
    <iframe id="appFrame" src="/kabina-web/index.html" title="تطبيق المشترك — كابينة" allow="geolocation"></iframe>
  </div>
</main>
<script>
(function(){
  var f=document.getElementById("appFrame"), b=document.getElementById("boot");
  function hide(){ if(b) b.classList.add("gone"); }
  if(f){ f.addEventListener("load", function(){ setTimeout(hide, 400); }); }
  setTimeout(hide, 6000); /* صمّامُ أمان */
})();
</script>
</body>
</html>
